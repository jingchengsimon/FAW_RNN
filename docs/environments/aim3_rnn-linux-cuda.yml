name: aim3_rnn
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pytorch=2.3.*
  - torchvision=0.18.*
  - torchaudio=2.3.*
  - pytorch-cuda=12.1
  - cuda-nvcc=12.1
  - numpy>=2,<3
  - pandas>=2,<4
  - matplotlib>=3.10,<4
  - scipy>=1.17,<2
  - scikit-learn>=1.8,<2
  - packaging
  - setuptools
  - tqdm>=4.65,<5
  - wheel
  - pip:
      - ale-py==0.12.0
      - gymnasium[atari,accept-rom-license]==1.3.0
      - opencv-python>=4.8,<5
      - mamba-ssm==2.2.4
      - s5-pytorch==0.2.1
